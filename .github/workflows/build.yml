name: Build MC Tiers Mod
on:
  workflow_dispatch:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - run: gradle build --no-daemon
      - run: test -f build/libs/mc-tiers-1.0.0.jar
      - run: unzip -l build/libs/mc-tiers-1.0.0.jar | grep -q 'fabric.mod.json'
      - uses: actions/upload-artifact@v4
        with:
          name: mc-tiers-1.21.11
          path: build/libs/mc-tiers-1.0.0.jar
          if-no-files-found: error
