name: Build MC Tiers Mod
on:
  workflow_dispatch:
  push:
    branches: ["main", "port/minecraft-26.1"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.4.0"
      - name: Build Minecraft 26.1 mod
        run: gradle clean build --no-daemon --stacktrace
      - name: Verify mod JAR
        shell: bash
        run: |
          JAR="$(find build/libs -maxdepth 1 -type f -name 'mc-tiers-*.jar' ! -name '*-sources.jar' | head -n 1)"
          test -n "$JAR"
          unzip -l "$JAR" | grep -q 'fabric.mod.json'
          echo "Verified: $JAR"
      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: mc-tiers-26.1
          path: build/libs/mc-tiers-*.jar
          if-no-files-found: error
