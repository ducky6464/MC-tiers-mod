name: Build MC Tiers Mod
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - name: Record build environment
        run: |
          mkdir -p diagnostics
          {
            echo "Commit: $GITHUB_SHA"
            echo "Runner: $RUNNER_OS"
            echo "Java:"
            java -version 2>&1
            echo "Gradle:"
            gradle --version
          } > diagnostics/build-environment.txt
      - name: Build with full diagnostics
        id: build
        continue-on-error: true
        run: |
          set -o pipefail
          gradle build --no-daemon --stacktrace --info 2>&1 | tee diagnostics/gradle-build.log
      - name: Name JAR
        if: steps.build.outcome == 'success'
        run: cp build/libs/mc-tiers-1.0.0.jar build/libs/mc-tiers_1.21.11_v5.jar
      - name: Verify JAR
        if: steps.build.outcome == 'success'
        run: |
          test -f build/libs/mc-tiers_1.21.11_v5.jar
          unzip -l build/libs/mc-tiers_1.21.11_v5.jar | grep -q 'fabric.mod.json'
      - name: Upload JAR
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: mc-tiers_1.21.11_v5
          path: build/libs/mc-tiers_1.21.11_v5.jar
          if-no-files-found: error
      - name: Upload exact build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mc-tiers-build-diagnostics
          path: diagnostics/
          if-no-files-found: warn
          retention-days: 14
      - name: Fail workflow when build failed
        if: steps.build.outcome != 'success'
        run: exit 1
