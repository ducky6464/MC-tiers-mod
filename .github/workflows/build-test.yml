name: Build MC-Tiers Mod

on:
  push:
    branches:
      - fix/1.21.11-nameplate-render-state
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build mod
        run: ./gradlew --no-daemon build
      - name: Upload mod JARs
        uses: actions/upload-artifact@v4
        with:
          name: MC-Tiers-1.21.11-test-build
          path: build/libs/*.jar
          if-no-files-found: error
